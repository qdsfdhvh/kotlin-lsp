name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: kotlin-lsp
            asset: kotlin-lsp-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: kotlin-lsp
            asset: kotlin-lsp-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: kotlin-lsp
            asset: kotlin-lsp-darwin-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: kotlin-lsp
            asset: kotlin-lsp-darwin-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: kotlin-lsp.exe
            asset: kotlin-lsp-windows-x86_64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            binary: kotlin-lsp.exe
            asset: kotlin-lsp-windows-aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/${{ matrix.asset }}
          chmod +x dist/${{ matrix.asset }}
          tar -czf dist/${{ matrix.asset }}.tar.gz -C dist ${{ matrix.asset }}

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # Asset folder layout mirrors Unix: dist/<asset>/kotlin-lsp.exe so the
          # zip extracts to a predictable directory.
          $assetDir = "dist/${{ matrix.asset }}"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$assetDir/kotlin-lsp.exe"
          Compress-Archive -Path $assetDir -DestinationPath "dist/${{ matrix.asset }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.zip
          if-no-files-found: ignore


  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir release
          cp artifacts/kotlin-lsp-*/kotlin-lsp-*.tar.gz release/ 2>/dev/null || true
          cp artifacts/kotlin-lsp-*/kotlin-lsp-*.zip release/ 2>/dev/null || true
          cp scripts/install.sh release/install.sh
          cp scripts/install.ps1 release/install.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false

